  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

  .empty { text-align: center; padding: 3rem; color: var(--color-text-secondary); font-size: 14px; grid-column: 1/-1; }

</style>

const DOMAINS = [...new Set(DATA.map(d => d.domain.split(" / ")[0]))].sort();
const LEVELS = ["beginner", "intermediate"];

let activeDomains = new Set(DOMAINS);
let activeLevels = new Set(LEVELS);

function renderFilters() {
  const df = document.getElementById("domain-filters");
  const lf = document.getElementById("level-filters");
  df.innerHTML = '';
  lf.innerHTML = '';

  DOMAINS.forEach(d => {
    const p = document.createElement("span");
    p.className = "pill" + (activeDomains.has(d) ? " active" : "");
    p.textContent = d;
    p.onclick = () => { activeDomains.has(d) ? activeDomains.delete(d) : activeDomains.add(d); render(); };
    df.appendChild(p);
  });

  LEVELS.forEach(l => {
    const p = document.createElement("span");
    p.className = "pill" + (activeLevels.has(l) ? " active" : "");
    p.textContent = l.charAt(0).toUpperCase() + l.slice(1);
    p.onclick = () => { activeLevels.has(l) ? activeLevels.delete(l) : activeLevels.add(l); render(); };
    lf.appendChild(p);
  });
}

function render() {
  renderFilters();
  const filtered = DATA.filter(d => {
    const dom = d.domain.split(" / ")[0];
    return activeDomains.has(dom) && activeLevels.has(d.level);
  });

  const grid = document.getElementById("grid");
  const stats = document.getElementById("stats");
  stats.textContent = filtered.length + " of " + DATA.length + " projects shown";
  grid.innerHTML = '';

  if (!filtered.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No projects match. Try selecting more filters.";
    grid.appendChild(e);
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    const badgeCls = p.level === "beginner" ? "b-beginner" : "b-intermediate";
    const toolHtml = p.tools.map(t => `<span class="tool-tag">${t}</span>`).join('');
    const linkHtml = p.links.map(l =>
      `<a class="link-btn" href="${l.url}" target="_blank" rel="noopener"><i class="ti ti-external-link" aria-hidden="true" style="font-size:12px"></i>${l.label}</a>`
    ).join('');

    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">${p.title}</div>
        <span class="badge ${badgeCls}">${p.level}</span>
      </div>
      <div class="card-domain">${p.domain}</div>
      <div class="card-desc">${p.desc}</div>
      <div class="tools">${toolHtml}</div>
      <div class="links">${linkHtml}</div>
    `;
    grid.appendChild(card);
  });
}

render();
